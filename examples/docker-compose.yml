# Example deployment for the CLI-free Codex Web frontend.
# The Codex CLI and `codex app-server` run separately from this service. They
# may run in another container, natively on the host, or on a reachable system.
# `ghcr.io/icoretech/codex-docker:latest` is one possible companion image, not
# a required dependency. Any other image can be used if it provides a compatible
# `codex app-server` over ws://, wss://, or a shared Unix socket.

services:
  codex-web:
    image: 0to99/codex-web-docker:latest
    container_name: codex-web

    # Adds a small PID 1 that forwards stop signals and reaps child processes.
    init: true
    restart: unless-stopped

    environment:
      # The default assumes an app-server container named `codex-app-server` on
      # the shared `codex` network. Set another reachable endpoint as needed.
      # Accepted transports are ws://, wss://, and unix:///absolute/socket/path.
      CODEX_APP_SERVER_URL: ${CODEX_APP_SERVER_URL:-ws://codex-app-server:4500}

      # Optional URL path below which the complete web application is served.
      # Keep `/` for a dedicated host name, or use a path ending in `/`, such as
      # `/my/example/subdir/`. The reverse proxy must preserve this prefix.
      CODEX_WEB_BASE_PATH: ${CODEX_WEB_BASE_PATH:-/}

      # Optional connection limits and their defaults:
      # CODEX_APP_SERVER_MAX_PAYLOAD: 104857600
      # CODEX_APP_SERVER_HANDSHAKE_TIMEOUT_MS: 10000

      # Initial connection immediately, then 10s, 10s, 20s, 30s; repeat the last delay.
      CODEX_APP_SERVER_RETRY_DELAYS_MS: ${CODEX_APP_SERVER_RETRY_DELAYS_MS:-10000,10000,20000,30000}
      # 0 means keep waiting indefinitely (also during initial startup).
      CODEX_APP_SERVER_RETRY_MAX_ATTEMPTS: ${CODEX_APP_SERVER_RETRY_MAX_ATTEMPTS:-0}
      # Optional: CODEX_APP_SERVER_RESUME_TIMEOUT_MS: 30000
      # Optional: CODEX_WEB_ELECTRON_DEBUG: "1"

    ports:
      # Bind only to the Docker host for local access. Remove this mapping when
      # a reverse proxy reaches codex-web through a shared Docker network.
      - "127.0.0.1:8214:8214"

    volumes:
      # Web settings and local state; fresh named volumes inherit UID/GID 1000.
      - codex-web-home:/home/node/.codex
      # The app-server must access this workspace at the identical absolute path
      # /workspace, whether it runs in a container or natively on the host.
      - ${WORKSPACE_PATH:-./workspace}:/workspace

    networks:
      # Core operation through the external app-server does not require direct
      # internet access from this container. On an internal-only network,
      # optional Desktop cloud features are unavailable; see DOCKER.md.
      - codex

networks:
  # Deliberately use a user-defined bridge network instead of host networking
  # or Docker's shared default `bridge`. It provides isolation and DNS-based
  # container-name resolution for the app-server connection.
  # Create it once with `docker network create --driver bridge codex`, or as an
  # external bridge network in Portainer. A containerized app-server must join
  # this network too; a native or remote app-server only needs to be reachable.
  codex:
    name: codex
    external: true

volumes:
  codex-web-home:
