# Standalone Codex stack: `docker compose -f examples/docker-compose.yml up -d`
# CLI image: https://github.com/icoretech/codex-docker
# Web fork:  https://github.com/0-99/codex-web-docker
# Web image: https://hub.docker.com/r/0to99/codex-web-docker
#
# First start (one-time account setup, credentials stay in codex_data):
#   docker compose -f examples/docker-compose.yml exec codex-cli codex-bootstrap device-auth
#   docker compose -f examples/docker-compose.yml exec codex-cli codex-bootstrap status
#   docker compose -f examples/docker-compose.yml exec codex-cli codex
# In the interactive CLI, trust /workspace when prompted. Then open
# http://127.0.0.1:8214/ (or the configured CODEX_WEB_BASE_PATH).
# No existing networks, named volumes, reverse proxy or MCP tokens are required.

services:
  codex-cli:
    # Keep this version aligned with test/integration/images.json's supported image.
    image: ghcr.io/icoretech/codex-docker:0.163.0
    init: true
    restart: unless-stopped
    working_dir: /workspace

    # Bubblewrap needs namespace syscalls and its own /proc mount. These options
    # remove Docker's extra seccomp/system-path restrictions for the CLI only.
    # They do not grant SYS_ADMIN. Keep the web service's default restrictions.
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined
      # Only add this if the host's AppArmor policy actually blocks bubblewrap:
      # - apparmor=unconfined

    environment:
      CODEX_HOME: /home/codex/.codex
      # Optional: pass a credential to an MCP server configured separately.
      # Replace MCP_API_TOKEN with the environment variable that server expects
      # and set its value in your local .env/stack environment.
      # MCP_API_TOKEN: ${MCP_API_TOKEN:-}

    volumes:
      - codex_data:/home/codex/.codex
      - codex_workspace:/workspace
      # Projectless Desktop chats use this absolute path. Both containers must
      # see the same workspace here as well as at /workspace.
      - codex_workspace:/home/node/Documents/Codex
      - codex_socket:/run/codex
      # CLI 0.163 publishes a symlink to its protected socket in this directory.
      - codex_daemon:/tmp/codex-daemon-1000

    networks:
      - cli_egress
      - cli_internal
    extra_hosts:
      # Optional access to services on the Docker host, e.g. an MCP endpoint.
      - "host.docker.internal:host-gateway"

    # The web service reaches this socket through the shared volume, not TCP.
    command: [app-server, --listen, "unix:///run/codex/app-server.sock"]
    healthcheck:
      test: [CMD-SHELL, "test -S /run/codex/app-server.sock"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    stdin_open: true
    tty: true

  codex-web:
    # CLI-free frontend; the CLI runs only in the separate service above.
    image: 0to99/codex-web-docker:latest
    init: true
    restart: unless-stopped
    # Start the CLI container first, without requiring it to be healthy. The
    # frontend stays available and shows reconnect status while the CLI is down.
    depends_on:
      codex-cli:
        condition: service_started

    environment:
      CODEX_APP_SERVER_URL: unix:///run/codex/app-server.sock
      # For a reverse-proxy subpath, e.g. /my/example/subdir/, set this variable
      # and forward the prefix unchanged. The standalone default is /.
      CODEX_WEB_BASE_PATH: ${CODEX_WEB_BASE_PATH:-/}
      CODEX_APP_SERVER_RETRY_DELAYS_MS: ${CODEX_APP_SERVER_RETRY_DELAYS_MS:-10000,10000,20000,30000}
      # 0 means keep waiting indefinitely, including during initial startup.
      CODEX_APP_SERVER_RETRY_MAX_ATTEMPTS: ${CODEX_APP_SERVER_RETRY_MAX_ATTEMPTS:-0}
      # Optional transport settings:
      # CODEX_APP_SERVER_MAX_PAYLOAD: "104857600"
      # CODEX_APP_SERVER_HANDSHAKE_TIMEOUT_MS: "10000"
      # CODEX_APP_SERVER_RESUME_TIMEOUT_MS: "30000"
      # CODEX_WEB_ELECTRON_DEBUG: "1"

    volumes:
      - codex_web_data:/home/node/.codex
      - codex_workspace:/workspace
      - codex_workspace:/home/node/Documents/Codex
      - codex_socket:/run/codex
      # CLI 0.163 publishes a symlink to its protected socket in this directory.
      - codex_daemon:/tmp/codex-daemon-1000
    ports:
      # Ready for local use without a reverse proxy. Authenticate the web UI
      # at your proxy/VPN before exposing it beyond a trusted network.
      - "127.0.0.1:8214:8214"
    networks:
      - web_access

volumes:
  # Compose creates project-scoped, persistent account/settings/workspace volumes.
  # Existing installation-specific volume names are deliberately not assumed.
  codex_data:
  codex_web_data:
  codex_workspace:
  # Transient socket state only. Both runtime images use UID/GID 1000.
  # Docker creates the mount with usable ownership; no root helper is needed.
  codex_socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64k,uid=1000,gid=1000,mode=0700"

  # Physical sockets behind /run/codex aliases; share the exact absolute path.
  codex_daemon:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64k,uid=1000,gid=1000,mode=0700"

networks:
  # Only the CLI gets outbound connectivity for OpenAI and external MCP servers.
  cli_egress:
    driver: bridge
  # Optional internal MCP/sidecar services can join this Compose-managed network.
  cli_internal:
    driver: bridge
    internal: true
  # Frontend has no independent internet access. A reverse proxy can optionally
  # join this network; the localhost port above works without one.
  web_access:
    driver: bridge
    internal: true
