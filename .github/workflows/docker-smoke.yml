# https://docs.docker.com/build/ci/github-actions/multi-platform/

name: Smoke-test every supported platform

on:
  pull_request:
  workflow_call:

jobs:
  browser_runtime:
    name: Test browser status and mobile layout
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser-runtime

  smoke_test:
    name: Build and smoke-test Docker image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            tag_suffix: amd64
          - platform: linux/arm64
            tag_suffix: arm64
          - platform: linux/ppc64le
            tag_suffix: ppc64le
          - platform: linux/s390x
            tag_suffix: s390x
          - platform: linux/arm/v7
            tag_suffix: arm-v7

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build local smoke-test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: ${{ matrix.platform }}
          push: false
          tags: codex-web-docker:smoke-${{ matrix.tag_suffix }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=smoke-${{ matrix.tag_suffix }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.tag_suffix }}

      - name: Verify container startup and HTTP endpoint
        shell: bash
        run: |
          set -euo pipefail
          container_name=codex-web-smoke
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --env CODEX_APP_SERVER_URL=ws://127.0.0.1:9 \
            --publish 127.0.0.1:8214:8214 \
            codex-web-docker:smoke-${{ matrix.tag_suffix }}

          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8214/ >/dev/null; then
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container_name")" != "true" ]]; then
              docker logs "$container_name"
              exit 1
            fi
            sleep 1
          done

          docker logs "$container_name"
          exit 1

      - name: Verify exhausted retries stop the container with an error
        shell: bash
        run: |
          set -euo pipefail
          container_name=codex-web-retry-exhaustion-smoke
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --env CODEX_APP_SERVER_URL=ws://127.0.0.1:9 \
            --env CODEX_APP_SERVER_RECONNECT_ATTEMPTS=0 \
            --env CODEX_APP_SERVER_RECONNECT_BACKOFF_ATTEMPTS=0 \
            codex-web-docker:smoke-${{ matrix.tag_suffix }}

          if ! exit_code="$(timeout 60s docker wait "$container_name")"; then
            docker logs "$container_name"
            # Early Desktop startup errors can be written to its log directory
            # before the normal console logger is installed.
            docker exec "$container_name" node -e '
              const fs = require("node:fs"), path = require("node:path");
              function logs(dir) {
                if (!fs.existsSync(dir)) return;
                for (const entry of fs.readdirSync(dir, {withFileTypes: true})) {
                  const file = path.join(dir, entry.name);
                  if (entry.isDirectory()) logs(file);
                  else if (/\.log$/.test(file)) console.log(file + "\n" + fs.readFileSync(file, "utf8").split("\n").slice(-30).join("\n"));
                }
              }
              logs("/home/node/.codex/logs");
            ' || true
            exit 1
          fi
          if [[ "$exit_code" == "0" ]]; then
            docker logs "$container_name"
            echo "Container unexpectedly exited successfully" >&2
            exit 1
          fi

      - name: Verify fresh Codex-home volume ownership and persistence
        shell: bash
        run: |
          set -euo pipefail
          volume_name=codex-web-home-smoke-${{ matrix.tag_suffix }}
          trap 'docker volume rm "$volume_name" >/dev/null 2>&1 || true' EXIT
          docker volume create "$volume_name" >/dev/null
          docker run --rm --volume "$volume_name:/home/node/.codex" \
            --entrypoint node codex-web-docker:smoke-${{ matrix.tag_suffix }} \
            -e 'const fs=require("node:fs"); if(process.getuid()!==1000) process.exit(1); fs.writeFileSync("/home/node/.codex/volume-smoke", "persisted");'
          docker run --rm --volume "$volume_name:/home/node/.codex" \
            --entrypoint node codex-web-docker:smoke-${{ matrix.tag_suffix }} \
            -e 'const fs=require("node:fs"); if(fs.readFileSync("/home/node/.codex/volume-smoke", "utf8")!=="persisted") process.exit(1);'

  all_in_one_smoke:
    name: Smoke-test Web and CLI together (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            tag_suffix: amd64
          - platform: linux/arm64
            tag_suffix: arm64
    steps:
      - uses: actions/checkout@v5
      - run: docker compose --file examples/all-in-one.compose.yml config --quiet
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build combined runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: all-in-one
          load: true
          platforms: ${{ matrix.platform }}
          tags: codex-web-all-in-one:smoke-${{ matrix.tag_suffix }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=all-in-one-${{ matrix.tag_suffix }}
          cache-to: type=gha,mode=max,scope=all-in-one-${{ matrix.tag_suffix }}
      - name: Verify both services and the single persistent volume
        shell: bash
        run: |
          set -euo pipefail
          image=codex-web-all-in-one:smoke-${{ matrix.tag_suffix }}
          container=codex-all-in-one-smoke
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; docker volume rm codex-all-data >/dev/null 2>&1 || true' EXIT
          docker volume create codex-all-data >/dev/null
          docker run -d --name "$container" --network none \
            --security-opt seccomp=unconfined --security-opt systempaths=unconfined \
            -v codex-all-data:/data "$image"
          test "$(docker inspect --format '{{len .Mounts}}' "$container")" = 1
          test "$(docker exec "$container" codex --version)" = 'codex-cli 0.164.0'
          for attempt in {1..60}; do
            if docker exec "$container" /bin/sh -ec 'test -S /run/codex/app-server.sock && wget -Y off -q -O /dev/null http://127.0.0.1:8214/'; then break; fi
            test "$(docker inspect --format '{{.State.Running}}' "$container")" = true
            sleep 1
          done
          docker exec "$container" /bin/sh -ec 'test "$(id -u)" = 1000; test -w "$CODEX_HOME"; test -w "$CODEX_WEB_USER_DATA_DIR"; test -w /data/auth; test "$(readlink /workspace)" = /data/workspace; test "$(readlink /home/node/Documents/Codex)" = /data/workspace; echo persisted > /workspace/.smoke; test "$(cat /home/node/Documents/Codex/.smoke)" = persisted'
          # GitHub's shared runner may deny unprivileged user/mount namespaces
          # even when Docker permits the syscalls. Keep host-policy failures
          # visible without treating them as an image regression.
          if ! sandbox_result=$(docker exec "$container" bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc --dev /dev \
            /bin/sh -ec 'test -r /workspace/.smoke' 2>&1); then
            case "$sandbox_result" in
              *'Failed to make / slave: Permission denied'*|*'Creating new namespace failed, likely because the kernel does not support user namespaces.'*)
                echo "::warning::GitHub runner kernel policy blocks bubblewrap: $sandbox_result" ;;
              *) echo "$sandbox_result"; exit 1 ;;
            esac
          fi
          docker restart "$container" >/dev/null
          for attempt in {1..60}; do
            if docker exec "$container" /bin/sh -ec 'test -S /run/codex/app-server.sock && wget -Y off -q -O /dev/null http://127.0.0.1:8214/ && test "$(cat /home/node/Documents/Codex/.smoke)" = persisted'; then exit 0; fi
            sleep 1
          done
          docker logs "$container"
          exit 1
