name: Test real Desktop and app-server offline

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: real-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime_image_chat:
    name: Built Web image with CLI 0.155.1 and browser chats
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check relay and status behavior before building the image
        run: |
          npm run build:server
          node --test test/codex-app-server-proxy.test.mjs test/web-runtime.test.mjs
      - name: Prepare pinned CLI 0.155.1 in an isolated network
        run: node test/integration/prepare-container.mjs supported
      - name: Verify the MCP timeout fixture before building the Web image
        shell: bash
        run: |
          set -euo pipefail
          sudo nsenter --target "$CODEX_TEST_NETWORK_PID" --net -- ip link set lo up
          sudo nsenter --target "$CODEX_TEST_NETWORK_PID" --net -- \
            runuser -u "$(id -un)" -- env "PATH=$PATH" \
              "CODEX_TEST_CLI_PATH=$CODEX_TEST_CLI_PATH" \
              "CODEX_TEST_IMAGE_REF=$CODEX_TEST_IMAGE_REF" \
              "CODEX_TEST_NETWORK_CONTAINER=$CODEX_TEST_NETWORK_CONTAINER" \
              "CODEX_TEST_CLI_SECURITY_OPTS=$CODEX_TEST_CLI_SECURITY_OPTS" \
              CODEX_TEST_NETWORK_ISOLATED=1 \
              "$(command -v node)" --test test/integration/mcp-timeout.mjs
      - run: npx playwright install --with-deps chromium
      - name: Build the actual Web runtime image
        run: docker build --build-arg SOURCE_REVISION=${{ github.sha }} --tag codex-web-chat-test:ci .
      - name: Confirm optional tools are absent from the runtime
        run: docker run --rm --network none --entrypoint /bin/sh codex-web-chat-test:ci -ec '! command -v gh; ! command -v git'
      - name: Exercise the built Web image in the real browser
        shell: bash
        run: |
          set -euo pipefail
          sudo nsenter --target "$CODEX_TEST_NETWORK_PID" --net -- ip link set lo up
          sudo nsenter --target "$CODEX_TEST_NETWORK_PID" --net -- \
            runuser -u "$(id -un)" -- env "PATH=$PATH" \
              "CODEX_TEST_CLI_PATH=$CODEX_TEST_CLI_PATH" \
              "CODEX_TEST_IMAGE_REF=$CODEX_TEST_IMAGE_REF" \
              "CODEX_TEST_NETWORK_CONTAINER=$CODEX_TEST_NETWORK_CONTAINER" \
              "CODEX_TEST_CLI_SECURITY_OPTS=$CODEX_TEST_CLI_SECURITY_OPTS" \
              CODEX_TEST_WEB_IMAGE_REF=codex-web-chat-test:ci \
              CODEX_TEST_NETWORK_ISOLATED=1 \
              "$(command -v node)" --test test/integration/runtime-image.mjs
      - name: Stop isolated test containers
        if: always()
        shell: bash
        run: |
          docker ps -aq --filter name=codex-ci-web- | xargs -r docker rm --force
          docker ps -aq --filter name=codex-ci-cli- | xargs -r docker rm --force
          docker rm --force codex-ci-network-supported || true

  integration:
    name: Real Desktop with ${{ matrix.cli }} CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cli: [baseline, upstream, supported, supported-current, candidate]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: docker compose --file examples/docker-compose.yml config --quiet
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm rebuild sharp better-sqlite3
      - run: npm run prepare
      - if: matrix.cli == 'baseline' || matrix.cli == 'upstream'
        run: node test/integration/install-cli.mjs ${{ matrix.cli }}
      - if: matrix.cli == 'supported' || matrix.cli == 'supported-current' || matrix.cli == 'candidate'
        id: prepare_container
        continue-on-error: ${{ matrix.cli == 'candidate' }}
        run: node test/integration/prepare-container.mjs ${{ matrix.cli }}
      - run: npx playwright install --with-deps chromium
      - name: Test binary with loopback networking only
        if: matrix.cli == 'baseline' || matrix.cli == 'upstream'
        shell: bash
        run: |
          set -euo pipefail
          integration_user="$(id -un)"
          integration_node="$(command -v node)"
          sudo unshare --net -- /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            exec runuser -u "$1" -- env "PATH=$2" "CODEX_TEST_CLI_PATH=$3" \
              CODEX_TEST_NETWORK_ISOLATED=1 CODEX_TEST_PAIRING=1 \
              "$4" --test --test-concurrency=1 \
              test/integration/app-server.mjs test/integration/desktop.mjs
          ' integration "$integration_user" "$PATH" "$CODEX_TEST_CLI_PATH" "$integration_node"
      - name: Test actual image in its network namespace
        if: matrix.cli == 'supported' || matrix.cli == 'supported-current' || (matrix.cli == 'candidate' && steps.prepare_container.outcome == 'success')
        id: container_test
        continue-on-error: ${{ matrix.cli == 'candidate' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo nsenter --target "$CODEX_TEST_NETWORK_PID" --net -- ip link set lo up
          sudo nsenter --target "$CODEX_TEST_NETWORK_PID" --net -- \
            runuser -u "$(id -un)" -- env "PATH=$PATH" \
              "CODEX_TEST_CLI_PATH=$CODEX_TEST_CLI_PATH" \
              "CODEX_TEST_IMAGE_REF=$CODEX_TEST_IMAGE_REF" \
              "CODEX_TEST_NETWORK_CONTAINER=$CODEX_TEST_NETWORK_CONTAINER" \
              "CODEX_TEST_CLI_SECURITY_OPTS=$CODEX_TEST_CLI_SECURITY_OPTS" \
              CODEX_TEST_NETWORK_ISOLATED=1 CODEX_TEST_PAIRING=1 \
              "$(command -v node)" --test --test-concurrency=1 \
              test/integration/app-server.mjs test/integration/desktop.mjs
      - name: Record candidate result
        if: always() && matrix.cli == 'candidate'
        env:
          PREPARE_RESULT: ${{ steps.prepare_container.outcome }}
          RESULT: ${{ steps.container_test.outcome }}
        run: |
          echo "Candidate preparation: **$PREPARE_RESULT**; integration: **$RESULT**." >> "$GITHUB_STEP_SUMMARY"
          echo "This is an advisory upgrade probe. Its result does not fail this workflow and does not change the supported image." >> "$GITHUB_STEP_SUMMARY"
      - name: Stop container test runtime
        if: always() && (matrix.cli == 'supported' || matrix.cli == 'supported-current' || matrix.cli == 'candidate')
        shell: bash
        run: |
          docker ps -aq --filter name=codex-ci-cli- | xargs -r docker rm --force
          docker rm --force "codex-ci-network-${{ matrix.cli }}" || true
      - name: Keep failure diagnostics
        if: always() && (failure() || (matrix.cli == 'candidate' && (steps.prepare_container.outcome == 'failure' || steps.container_test.outcome == 'failure')))
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.cli }}
          path: scratch/integration-results/
          if-no-files-found: ignore

  workspace_routing:
    name: Verify workspace routing with actual CLI 0.155.1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm rebuild sharp better-sqlite3
      - run: npm run prepare
      - run: node test/integration/prepare-container.mjs supported
      # This authenticated-protocol regression is separate from the long browser
      # cold-start suite so its real-image result remains directly reviewable.
      - name: Exercise ChatGPT routing and turn in the isolated image
        shell: bash
        run: |
          set -euo pipefail
          sudo nsenter --target "$CODEX_TEST_NETWORK_PID" --net -- ip link set lo up
          sudo nsenter --target "$CODEX_TEST_NETWORK_PID" --net -- \
            runuser -u "$(id -un)" -- env "PATH=$PATH" \
              "CODEX_TEST_CLI_PATH=$CODEX_TEST_CLI_PATH" \
              "CODEX_TEST_IMAGE_REF=$CODEX_TEST_IMAGE_REF" \
              "CODEX_TEST_NETWORK_CONTAINER=$CODEX_TEST_NETWORK_CONTAINER" \
              "CODEX_TEST_CLI_SECURITY_OPTS=$CODEX_TEST_CLI_SECURITY_OPTS" \
              CODEX_TEST_NETWORK_ISOLATED=1 \
              "$(command -v node)" --test test/integration/workspace-routing.mjs
      - name: Stop routing test runtime
        if: always()
        shell: bash
        run: |
          docker ps -aq --filter name=codex-ci-cli- | xargs -r docker rm --force
          docker rm --force codex-ci-network-supported || true
